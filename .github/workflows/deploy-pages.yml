name: Deploy reviewed static site
on:
  push:
    branches: [feat/interactive-math-v1]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active Pages deployment intact; only one production run may publish.
concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jatjun/codex-ext1' && github.ref == 'refs/heads/feat/interactive-math-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Logic and artifact guard tests
        run: npm test
      - name: TypeScript check and production build
        run: npm run build
      - name: Inspect static files and record provenance
        run: npm run check:public
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production build at Pages subpath (desktop and mobile)
        run: npm run test:browser
      - name: Recheck the exact artifact before upload
        run: node --input-type=module -e "import { verifyBuild } from './scripts/check-public-build.mjs'; await verifyBuild('dist', process.env.SOURCE_SHA);"
      - name: Upload checked Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
          retention-days: 7

  deploy:
    # Explicit opt-in while the user reviews historical author information.
    if: vars.PUBLICATION_REVIEW_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require public repository and latest release commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(gh api repos/jatjun/codex-ext1 --jq .visibility)" = public || {
            echo 'Repository is still private. Complete the documented pre-publication review and GitHub settings first.'
            exit 1
          }
          test "$(gh api repos/jatjun/codex-ext1/git/ref/heads/feat/interactive-math-v1 --jq .object.sha)" = "$EXPECTED_SHA" || {
            echo 'A newer release commit exists; stale deployment blocked.'
            exit 1
          }
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        # Do not silently enable Pages or change repository visibility.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Record deployed source version
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployed source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
